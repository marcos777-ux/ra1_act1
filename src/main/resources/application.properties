spring.application.name=aadtex-ingestion-engine
spring.main.web-application-type=none
spring.main.banner-mode=off
# Linux: /workspace/store_data | Windows: C:/workspace/store_data
# Modificable con la variable de entorno AADTEX_ROOT o --aadtex.root-path=...
aadtex.root-path=${AADTEX_ROOT:}
aadtex.demo.enabled=${AADTEX_DEMO_ENABLED:true}
logging.level.com.makro.aadtex=INFO
# Se espera la firma asociada antes de consumir un CSV/ENC suelto
aadtex.require-signature=${AADTEX_REQUIRE_SIGNATURE:true}
